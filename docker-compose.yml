# Local development services. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipup}
    # Host port 5433 so it never clashes with a locally installed Postgres.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipup}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
