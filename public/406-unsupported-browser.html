<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>406 · Your browser is too old · ShipUp</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3EAD8;color:#2B211A;font-family:"Exo 2",system-ui,sans-serif}
    main{max-width:520px;padding:32px}
    .mark{display:inline-grid;place-items:center;width:38px;height:38px;background:#E8632B;box-shadow:inset 0 0 0 1.5px #2B211A;border-radius:2px;vertical-align:middle}
    .mark i{width:22px;height:22px;border:5.5px solid #2B211A;border-radius:50%;box-sizing:border-box}
    b{margin-left:10px;font-size:26px;vertical-align:middle}
    small{display:block;margin-top:48px;color:#6A5A4A;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    h1{margin:8px 0 14px;font-size:40px;line-height:1.1}
    p{margin:0 0 28px;color:#6A5A4A;font-size:17px;line-height:1.5}
    a{display:inline-block;padding:14px 18px;background:#E8632B;color:#2B211A;font-weight:600;text-decoration:none;border-radius:2px;box-shadow:inset 0 0 0 1.5px #2B211A,2px 2px 0 #2B211A}
  </style>
</head>
<body>
  <main>
    <span class="mark"><i></i></span><b>ShipUp</b>
    <small>Error 406</small>
    <h1>Your browser is too old</h1>
    <p>ShipUp needs a recent version of Chrome, Edge, Firefox or Safari.</p>
    <a href="/">Back to ShipUp</a>
  </main>
</body>
</html>
