# PostgreSQL. Development and test use the docker-compose service (see docker-compose.yml).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5433) %>
  username: <%= ENV.fetch("POSTGRES_USER", "shipup") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "shipup") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shipup_development

test:
  <<: *default
  database: shipup_test<%= ENV["TEST_ENV_NUMBER"] %>

# Production keeps Solid Cache/Queue/Cable in their own databases so a noisy
# queue can never starve the primary connection pool.
production:
  primary: &production
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "shipup_production") %>
  cache:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "shipup_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "shipup_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "shipup_production") %>_cable
    migrations_paths: db/cable_migrate
